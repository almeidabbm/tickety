<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data:; font-src 'self'; media-src file:"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Tickety</title>
  </head>
  <body>
    <main id="screen">
      <img class="backgroundOverlay" alt="" hidden />
      <img class="backgroundOverlay" alt="" hidden />
      <div id="scrim"></div>
      <section id="ticketCard" aria-live="polite">
        <p id="business" hidden></p>
        <div id="ticket">
          <p id="title">Senha atual</p>
          <p id="ticketNumber">–</p>
          <div id="history" hidden>
            <p>Anteriores</p>
            <ol id="historyList"></ol>
          </div>
        </div>
      </section>
    </main>
    <script src="../shared/queue.js"></script>
    <script src="../shared/chime.js"></script>
    <script src="../renderers/renderer.js"></script>
  </body>
</html>
